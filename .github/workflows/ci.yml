name: Validate SOBRIZEN

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Detect accidentally committed credentials
        run: node scripts/security-scan.mjs
      - name: Check dependency advisories
        run: npm audit --audit-level=high --ignore-scripts
      - name: Cache checksum-verified semantic data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            semantizen-vocabulary.json
            semantizen-vectors.bin
          key: semantic-${{ hashFiles('scripts/prepare-semantic-data.mjs') }}
      - name: Run application and database regressions
        run: npm test
      - name: Validate publishable application
        run: npm run build
